<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow" />
    <title>FLUI — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Style.css?v=3" />
    <link rel="stylesheet" href="admin.css?v=4" />
  </head>
  <body>
    <header class="site-header" id="topo">
      <nav class="nav" aria-label="Navegação principal">
        <div class="container nav__inner">
          <a class="brand" href="./index.html" aria-label="Ir para o início">
            <span class="brand__symbol" aria-hidden="true"></span>
            <span class="brand__text">FLUI</span>
          </a>

          <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="nav-menu">
            <span class="sr-only">Abrir menu</span>
            <span class="nav__toggleLines" aria-hidden="true">☰</span>
          </button>

          <div class="nav__menu" id="nav-menu">
            <a class="nav__link" href="./index.html#o-que-e">O que é</a>
            <a class="nav__link" href="./index.html#o-que-oferecemos">O que oferecemos</a>
            <a class="nav__link" href="./index.html#Utilizar-equipamentos">Equipamentos</a>
            <a class="nav__link" href="./index.html#projetos-e-acoes">Ações</a>
            <a class="nav__link" href="./index.html#eventos">Eventos</a>
            <a class="nav__link" href="./index.html#documentacao-flui">Documentos</a>
            <a class="nav__link" href="./index.html#docentes">Docentes</a>
            <a class="nav__link" href="./index.html#alunos">Bolsistas</a>
            <a class="nav__cta is-active" href="./login.html">Login</a>
            <a class="nav__cta" href="./uso.html">Uso</a>
            <a class="nav__cta" href="./emprestimo.html">Empréstimo</a>
          </div>
        </div>
      </nav>
    </header>

    <main class="auth-shell">
      <!-- TELA DE LOGIN -->
      <div class="auth-card" id="cardLogin">
        <div class="auth-card__head">
          <div class="brand" aria-hidden="true">
            <span class="brand__symbol"></span>
            <span class="brand__text">FLUI</span>
          </div>
          <h1>Entrar</h1>
        </div>

        <div class="oauth-stack">
          <a class="btn-oauth" href="https://flui-api.pedro-brito-flui.workers.dev/api/auth/google/login" data-provider="Google">
            <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 16 3 9.1 7.6 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 36 26.9 37 24 37c-5.2 0-9.6-3.3-11.2-7.9l-6.6 5.1C9 40.3 15.9 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.6C41.6 36 45 30.5 45 24c0-1.2-.1-2.4-1.4-3.5z"/></svg>
            Continuar com Google
          </a>
        </div>

        <div class="divider">ou com e-mail</div>

        <form id="loginForm">
          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required autocomplete="username" />
          </div>
          <div class="field">
            <label for="password">Senha</label>
            <input type="password" id="password" required autocomplete="current-password" />
          </div>

          <div class="msg msg--error" id="msg" style="display: none"></div>

          <button type="submit" class="btn btn--primary" id="btnEntrar" style="width:100%;">Entrar</button>
        </form>

        <p class="auth-foot">
          Novo usuário? <button type="button" id="btnCadastro">Crie sua conta aqui</button>
        </p>

        <a class="admin-login__back" href="./index.html">← Voltar para o site</a>
      </div>

      <!-- TELA DE CADASTRO -->
      <div class="auth-card auth-card--wide" id="cardCadastro" style="display: none">
        <div class="auth-card__head">
          <div class="brand" aria-hidden="true">
            <span class="brand__symbol"></span>
            <span class="brand__text">FLUI</span>
          </div>
          <h1>Criar conta</h1>
        </div>

        <div class="oauth-stack">
          <a class="btn-oauth" href="https://flui-api.pedro-brito-flui.workers.dev/api/auth/google/login" data-provider="Google">
            <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 16 3 9.1 7.6 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 36 26.9 37 24 37c-5.2 0-9.6-3.3-11.2-7.9l-6.6 5.1C9 40.3 15.9 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.6C41.6 36 45 30.5 45 24c0-1.2-.1-2.4-1.4-3.5z"/></svg>
            Cadastrar com Google
          </a>
        </div>

        <div class="divider">ou preencha seus dados</div>

        <form id="cadastroForm">
          <div class="field">
            <label for="cadNome">Nome completo</label>
            <input type="text" id="cadNome" name="nome" required autocomplete="name" />
          </div>
          <div class="field">
            <label for="cadEmail">E-mail</label>
            <input type="email" id="cadEmail" name="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="cadMatricula">Matrícula</label>
            <input type="text" id="cadMatricula" name="matricula" required autocomplete="off" />
          </div>
          <div class="field">
            <label for="cadCursoSetor">Curso/Setor</label>
            <input type="text" id="cadCursoSetor" name="curso_setor" required placeholder="ex: Automação Industrial, Coordenação..." />
          </div>
          <div class="field">
            <label for="cadVinculo">Vínculo</label>
            <select id="cadVinculo" name="vinculo" required>
              <option value="" disabled selected>Selecione…</option>
              <option value="estudante">Estudante</option>
              <option value="docente">Docente</option>
              <option value="servidor">Servidor(a)</option>
              <option value="externo">Externo à instituição</option>
            </select>
          </div>
          <div class="field">
            <label for="cadSenha">Senha</label>
            <input type="password" id="cadSenha" required autocomplete="new-password" />
            <p class="field-hint">Mínimo 8 caracteres.</p>
          </div>
          <div class="field">
            <label for="cadSenhaConfirmar">Confirmar senha</label>
            <input type="password" id="cadSenhaConfirmar" required autocomplete="new-password" />
          </div>

          <div class="msg msg--error" id="cadMsg" style="display: none"></div>

          <button type="submit" class="btn btn--primary" id="btnCriarConta" style="width:100%;">Criar conta</button>
        </form>

        <p class="auth-foot">
          Já tem conta? <button type="button" id="btnVoltarLogin">Entrar</button>
        </p>
      </div>
    </main>

    <script>
      const navToggle = document.querySelector(".nav__toggle");
      const navMenu = document.querySelector(".nav__menu");
      if (navToggle) {
        navToggle.addEventListener("click", () => {
          const expanded = navToggle.getAttribute("aria-expanded") === "true";
          navToggle.setAttribute("aria-expanded", !expanded);
          navMenu.classList.toggle("nav__menu--open");
        });
      }

      // O botão do Google (login e cadastro) aponta direto pro Worker (não
      // depende do Django/PythonAnywhere) — só funciona de verdade depois
      // que o app OAuth do Google for cadastrado e os secrets configurados;
      // até lá, o próprio Worker redireciona de volta pra cá com
      // "?erro=google_nao_configurado" em vez de dar erro feio do Google.
      const WORKER_URL = "https://flui-api.pedro-brito-flui.workers.dev";

      // --- Alternar entre a tela de login e a de cadastro ---
      const cardLogin = document.getElementById("cardLogin");
      const cardCadastro = document.getElementById("cardCadastro");

      document.getElementById("btnCadastro").addEventListener("click", () => {
        cardLogin.style.display = "none";
        cardCadastro.style.display = "block";
      });
      document.getElementById("btnVoltarLogin").addEventListener("click", () => {
        cardCadastro.style.display = "none";
        cardLogin.style.display = "block";
      });

      // --- Login ---
      // Tela única: primeiro tenta como conta de admin (painel do FabLab),
      // se não bater tenta como conta de usuário/patrono (Biblioteca) — as
      // duas ficam em tabelas separadas no banco, então não dá pra saber de
      // antemão qual é a certa só pelo e-mail digitado.
      const loginForm = document.getElementById("loginForm");
      const msg = document.getElementById("msg");
      const btnEntrar = document.getElementById("btnEntrar");

      function mostrarErro(texto) {
        msg.textContent = texto;
        msg.style.display = "block";
      }

      // Se o Google redirecionou de volta com erro (ex: app ainda sem
      // secret configurado, sessão expirada, etc.), mostra o motivo aqui em
      // vez de cair na tela de login sem explicação.
      const ERROS_GOOGLE = {
        oauth_state: "A sessão de login expirou antes de terminar. Tente novamente.",
        google_nao_configurado: "O login com Google ainda não foi configurado. Use e-mail e senha por enquanto.",
        google_token: "Não foi possível confirmar o login com o Google. Tente novamente.",
        google_perfil: "Não foi possível obter seus dados do Google. Tente novamente ou entre com e-mail e senha.",
        google_conta: "Não foi possível criar/atualizar sua conta no banco de dados. Tente novamente em instantes.",
        google_sem_email: "Sua conta do Google não tem um e-mail público — é preciso liberar isso lá ou criar conta por e-mail e senha aqui.",
      };
      const erro = new URLSearchParams(window.location.search).get("erro") || "";
      if (ERROS_GOOGLE[erro]) {
        mostrarErro(ERROS_GOOGLE[erro]);
      }

      // Se já tiver sessão válida (admin ou usuário), pula direto.
      (async () => {
        try {
          const resAdmin = await fetch(`${WORKER_URL}/api/admin/me`, { credentials: "include" });
          if (resAdmin.ok) {
            window.location.href = "./admin.html";
            return;
          }
        } catch (e) {
          /* segue */
        }
        try {
          const resUsuario = await fetch(`${WORKER_URL}/api/usuarios/me`, { credentials: "include" });
          if (resUsuario.ok) {
            window.location.href = "./biblioteca.html";
          }
        } catch (e) {
          /* segue para o login normalmente */
        }
      })();

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.style.display = "none";
        btnEntrar.disabled = true;
        btnEntrar.textContent = "Entrando...";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {
          const resAdmin = await fetch(`${WORKER_URL}/api/admin/login`, {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          if (resAdmin.ok) {
            window.location.href = "./admin.html";
            return;
          }

          const resUsuario = await fetch(`${WORKER_URL}/api/usuarios/login`, {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const dataUsuario = await resUsuario.json().catch(() => ({}));
          if (!resUsuario.ok) {
            mostrarErro(dataUsuario.error || "E-mail ou senha inválidos.");
            return;
          }
          window.location.href = "./biblioteca.html";
        } catch (err) {
          mostrarErro("Erro de conexão. Tente novamente.");
        } finally {
          btnEntrar.disabled = false;
          btnEntrar.textContent = "Entrar";
        }
      });

      // --- Cadastro (conta de usuário/patrono, salva no banco D1) ---
      const cadastroForm = document.getElementById("cadastroForm");
      const cadMsg = document.getElementById("cadMsg");
      const btnCriarConta = document.getElementById("btnCriarConta");

      function mostrarErroCadastro(texto) {
        cadMsg.textContent = texto;
        cadMsg.style.display = "block";
      }

      cadastroForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        cadMsg.style.display = "none";

        const nome = document.getElementById("cadNome").value.trim();
        const email = document.getElementById("cadEmail").value.trim();
        const matricula = document.getElementById("cadMatricula").value.trim();
        const cursoSetor = document.getElementById("cadCursoSetor").value.trim();
        const vinculo = document.getElementById("cadVinculo").value;
        const senha = document.getElementById("cadSenha").value;
        const senhaConfirmar = document.getElementById("cadSenhaConfirmar").value;

        if (!matricula) {
          mostrarErroCadastro("A matrícula é obrigatória.");
          return;
        }
        if (senha.length < 8) {
          mostrarErroCadastro("A senha precisa ter pelo menos 8 caracteres.");
          return;
        }
        if (senha !== senhaConfirmar) {
          mostrarErroCadastro("As senhas não coincidem.");
          return;
        }

        btnCriarConta.disabled = true;
        btnCriarConta.textContent = "Criando conta...";

        try {
          const res = await fetch(`${WORKER_URL}/api/usuarios/cadastro`, {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              nome,
              email,
              matricula,
              curso_setor: cursoSetor,
              vinculo,
              password: senha,
            }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            mostrarErroCadastro(data.error || "Não foi possível criar a conta.");
            return;
          }
          window.location.href = "./biblioteca.html";
        } catch (err) {
          mostrarErroCadastro("Erro de conexão. Tente novamente.");
        } finally {
          btnCriarConta.disabled = false;
          btnCriarConta.textContent = "Criar conta";
        }
      });
    </script>
  </body>
</html>
